# PLANTILLA — copiar a `.github/workflows/publish.yml` del repositorio de la aplicación.
#
# Sustituir en todo el archivo:
#   <APP>      → estudiante | docente | gestor
#   <DIR>      → app-estudiante | app-docente | app-gestor
#   <PRODUCTO> → MDM MultiCulture.Play - Estudiante | - Docente | - Gestor
#
# Secretos requeridos en el repositorio de la aplicación:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD, RELEASES_TOKEN
#
# ESTADO: plantilla escrita y documentada, TODAVÍA NO EJECUTADA. No se considera válida hasta que
# exista una release real en mdm-releases con su latest.json y una instalación que se haya
# actualizado sola. Ver README.md, sección 5.

name: Publicar versión firmada

on:
  push:
    tags:
      - '<APP>-v*'

permissions:
  contents: read

env:
  APP: <APP>
  DIR: <DIR>

jobs:
  # ── 1. Compilar y firmar, en las dos plataformas que se autoactualizan ─────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
            bundles: appimage
          - os: windows-latest
            target: windows-x86_64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ${{ env.DIR }}/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - name: Dependencias de sistema (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Instalar dependencias del frontend
        working-directory: ${{ env.DIR }}
        run: pnpm install --frozen-lockfile

      - name: Compilar, firmar y empaquetar
        working-directory: ${{ env.DIR }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Guardar artefactos de esta plataforma
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-${{ matrix.target }}
          if-no-files-found: error
          path: |
            ${{ env.DIR }}/src-tauri/target/release/bundle/nsis/*.nsis.zip
            ${{ env.DIR }}/src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
            ${{ env.DIR }}/src-tauri/target/release/bundle/nsis/*-setup.exe
            ${{ env.DIR }}/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            ${{ env.DIR }}/src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig
            ${{ env.DIR }}/src-tauri/target/release/bundle/appimage/*.AppImage

  # ── 2. Publicar en el canal y actualizar el endpoint del sitio ─────────────────────────────────
  publicar:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true

      - name: Versión publicada
        id: v
        run: echo "version=${GITHUB_REF_NAME#<APP>-v}" >> "$GITHUB_OUTPUT"

      - name: Crear la release en el canal público
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release create "${APP}-v${{ steps.v.outputs.version }}" \
            --repo Korosoft-Team/mdm-releases \
            --title "<PRODUCTO> ${{ steps.v.outputs.version }}" \
            --notes "Versión ${{ steps.v.outputs.version }} de la aplicación <APP>. Ver el detalle de cambios en este repositorio." \
            artefactos/*

      - name: Actualizar latest.json en la rama del sitio
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.v.outputs.version }}"
          BASE="https://github.com/Korosoft-Team/mdm-releases/releases/download/${APP}-v${V}"
          # Las firmas son el contenido literal de los .sig, no su ruta.
          SIG_WIN=$(cat artefactos/*.nsis.zip.sig)
          SIG_LIN=$(cat artefactos/*.AppImage.tar.gz.sig)
          WIN=$(basename "$(ls artefactos/*.nsis.zip)")
          LIN=$(basename "$(ls artefactos/*.AppImage.tar.gz)")
          jq -n --arg v "$V" --arg w "$SIG_WIN" --arg wu "$BASE/$WIN" \
                --arg l "$SIG_LIN" --arg lu "$BASE/$LIN" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version:$v, notes:"", pub_date:$d,
              platforms:{"windows-x86_64":{signature:$w,url:$wu},
                         "linux-x86_64":{signature:$l,url:$lu}}}' > latest.json
          git clone --depth 1 --branch updates \
            "https://x-access-token:${GH_TOKEN}@github.com/Korosoft-Team/mdm-releases.git" sitio
          mkdir -p "sitio/${APP}"
          mv latest.json "sitio/${APP}/latest.json"
          cd sitio
          git config user.name "publicacion-automatica"
          git config user.email "publicacion@korosoft.invalid"
          git add -A
          git commit -m "publicacion(${APP}): $V"
          git push origin updates
